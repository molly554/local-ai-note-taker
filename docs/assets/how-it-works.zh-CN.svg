<rect x="193" y="355" width="214" height="58" rx="8" class="step"/><text x="300" y="379.5" text-anchor="middle" class="label">纪要流程：</text><text x="300" y="397.5" text-anchor="middle" class="label">按模型的分词器量好每一段</text>
