<svg xmlns="http://www.w3.org/2000/svg" width="860" height="467" viewBox="0 0 860 467" role="img" aria-labelledby="t d">
<title id="t">What one character costs the notes model, in tokens</title>
<desc id="d">Horizontal bars of tokens a character, against a guess of one third: AISHELL-4 test, Gemma 4 E4B: 0.68; AISHELL-4 test, Qwen3 1.7B: 0.64; VCSum, Gemma 4 E4B: 0.61; VCSum, Qwen3 1.7B: 0.58; QMSum (AMI + ICSI), Gemma 4 E4B: 0.25; QMSum (AMI + ICSI), Qwen3 1.7B: 0.24.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .title { font-size: 17px; font-weight: 600; fill: #0b0b0b; }
  .sub, .label { font-size: 12.5px; fill: #52514e; }
  .group { font-size: 12.5px; font-weight: 600; fill: #0b0b0b; }
  .head { font-size: 12px; font-weight: 600; fill: #52514e; }
  .value { font-size: 12px; fill: #0b0b0b; font-variant-numeric: tabular-nums; }
  .tick, .foot { font-size: 11.5px; fill: #898781; }
  .bar { fill: #2a78d6; }
  .grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
  .base { stroke: #c3c2b7; stroke-width: 1; fill: none; }
  .guess { stroke: #52514e; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .title, .group, .value { fill: #f0efec; }
    .sub, .label, .head { fill: #c3c2b7; }
    .bar { fill: #3987e5; }
    .grid { stroke: #2c2c2a; }
    .base { stroke: #383835; }
    .guess { stroke: #c3c2b7; }
  }
</style>
<rect x="0.5" y="0.5" width="859" height="466" rx="12" class="surface"/>
<path d="M262 138V198" class="base"/><path d="M262 232V292" class="base"/><path d="M262 326V386" class="base"/><text x="262" y="408" class="tick" text-anchor="middle">0</text>
<path d="M377 138V198" class="grid"/><path d="M377 232V292" class="grid"/><path d="M377 326V386" class="grid"/><text x="377" y="408" class="tick" text-anchor="middle">0.2</text>
<path d="M492 138V198" class="grid"/><path d="M492 232V292" class="grid"/><path d="M492 326V386" class="grid"/><text x="492" y="408" class="tick" text-anchor="middle">0.4</text>
<path d="M607 138V198" class="grid"/><path d="M607 232V292" class="grid"/><path d="M607 326V386" class="grid"/><text x="607" y="408" class="tick" text-anchor="middle">0.6</text>
<path d="M722 138V198" class="grid"/><path d="M722 232V292" class="grid"/><path d="M722 326V386" class="grid"/><text x="722" y="408" class="tick" text-anchor="middle">0.8</text>
<text x="492" y="426" class="tick" text-anchor="middle">tokens a character</text>
<text x="28" y="40" class="title">What one character costs the notes model, in tokens</text>
<text x="28" y="59" class="sub">Counted by the app’s own tokenizers over every line of 455 meeting transcripts</text>
<text x="28" y="78" class="sub">A Chinese character costs about twice the old guess; an English one, less than it</text>
<text x="28" y="130" class="group">Mandarin · AISHELL-4</text>
<text x="38" y="157" class="label">Gemma 4 E4B</text>
<path d="M262 147h385.9a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-385.9z" class="bar"/>
<text x="659.9" y="157" class="value">0.68</text>
<text x="38" y="187" class="label">Qwen3 1.7B</text>
<path d="M262 177h364a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-364z" class="bar"/>
<text x="638" y="187" class="value">0.64</text>
<text x="28" y="224" class="group">Mandarin · VCSum</text>
<text x="38" y="251" class="label">Gemma 4 E4B</text>
<path d="M262 241h345a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-345z" class="bar"/>
<text x="619" y="251" class="value">0.61</text>
<text x="38" y="281" class="label">Qwen3 1.7B</text>
<path d="M262 271h327.2a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-327.2z" class="bar"/>
<text x="601.2" y="281" class="value">0.58</text>
<text x="28" y="318" class="group">English · QMSum</text>
<text x="38" y="345" class="label">Gemma 4 E4B</text>
<path d="M262 335h138a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-138z" class="bar"/>
<text x="412" y="345" class="value">0.25</text>
<text x="38" y="375" class="label">Qwen3 1.7B</text>
<path d="M262 365h136.9a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-136.9z" class="bar"/>
<text x="410.9" y="375" class="value">0.24</text>
<path d="M453.7 112V392" class="guess"/><text x="453.7" y="104" class="head" text-anchor="middle">the old guess: 1/3</text>
<text x="28" y="445" class="foot">A guess that is too low makes a meeting look smaller than it is, so too much of it is sent at once. All figures: bench/real-meetings.</text>
</svg>
