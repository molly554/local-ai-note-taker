<svg xmlns="http://www.w3.org/2000/svg" width="860" height="524" viewBox="0 0 860 524" role="img" aria-labelledby="t d">
<title id="t">Meetings where the notes model is sent more than it can read</title>
<desc id="d">Horizontal bars. Before the changes, a prompt that does not fit was sent in AISHELL-4 test, call, names shown: 13 of 20; AISHELL-4 test, call, no names: 8 of 20; AISHELL-4 test, one microphone: 3 of 20; AISHELL-4 test, one microphone, no punctuation: 2 of 20; VCSum, call, names shown: 11 of 239; VCSum, call, no names: 30 of 239; VCSum, one microphone: 119 of 239; VCSum, one microphone, no punctuation: 112 of 239. Now: 0.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .title { font-size: 17px; font-weight: 600; fill: #0b0b0b; }
  .sub, .label { font-size: 12.5px; fill: #52514e; }
  .group { font-size: 12.5px; font-weight: 600; fill: #0b0b0b; }
  .head { font-size: 12px; font-weight: 600; fill: #52514e; }
  .value { font-size: 12px; fill: #0b0b0b; font-variant-numeric: tabular-nums; }
  .zero { font-size: 14px; font-weight: 600; fill: #0b0b0b; }
  .tick, .foot { font-size: 11.5px; fill: #898781; }
  .bar { fill: #2a78d6; }
  .grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
  .base { stroke: #c3c2b7; stroke-width: 1; fill: none; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .title, .group, .value, .zero { fill: #f0efec; }
    .sub, .label, .head { fill: #c3c2b7; }
    .bar { fill: #3987e5; }
    .grid { stroke: #2c2c2a; }
    .base { stroke: #383835; }
  }
</style>
