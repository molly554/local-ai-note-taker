# The Windows recorder (app/native/yogurt-audio-win): release build, unit tests, then protocol smoke tests,
# first with no audio devices, then on a virtual sound card (VB-CABLE: a speaker whose sound comes back as a microphone).
name: Windows audio helper

on:
  push:
    branches: [main]
    paths:
      - app/native/yogurt-audio-win/**
      - app/e2e/fixtures/meeting-*.wav
      - .github/workflows/native-windows-audio.yml
  pull_request:
    paths:
      - app/native/yogurt-audio-win/**
      - .github/workflows/native-windows-audio.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: app/native/yogurt-audio-win
    env:
      CARGO_TERM_COLOR: always
      # libopus 1.3.1's CMakeLists asks for CMake 3.1; CMake 4 needs this to configure it
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/native/yogurt-audio-win/target
          key: yogurt-audio-win-${{ hashFiles('app/native/yogurt-audio-win/Cargo.lock', 'app/native/yogurt-audio-win/rust-toolchain.toml') }}
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: No C runtime to install
        run: |
          $b = [IO.File]::ReadAllBytes("target/release/yogurt-audio.exe")
          $s = [Text.Encoding]::ASCII.GetString($b)
          if ($s -match 'VCRUNTIME140') { throw 'yogurt-audio.exe needs the Visual C++ runtime' }
          "size: $([math]::Round($b.Length / 1MB, 2)) MB"
      - name: Smoke test, before any audio device
        run: node smoke/smoke.mjs target/release/yogurt-audio.exe basic
      - name: Virtual sound card
        env:
          # VB-CABLE driver pack 43 (2016), the file sound-ci-helpers installs, checked here by hash
          VBCABLE_SHA256: 66fd0a4d9f4896ff41632b7e3d53892c085c4561f53e8ae8d0f0bc10eedd1cdd
        run: |
          git clone --quiet https://github.com/LABSN/sound-ci-helpers "$env:RUNNER_TEMP/sch"
          git -C "$env:RUNNER_TEMP/sch" checkout --quiet e9d6ba52163a3283714a68412036ddf33f78d49c
          $zip = "$env:RUNNER_TEMP/vbcable.zip"
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:VBCABLE_SHA256) { throw 'VB-CABLE download changed' }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/vbcable"
          certutil -addstore TrustedPublisher "$env:RUNNER_TEMP/sch/windows/vbcable.cer"
          & "$env:RUNNER_TEMP/sch/windows/devcon.exe" install "$env:RUNNER_TEMP/vbcable/vbMmeCable64_win7.inf" VBAudioVACWDM
          Set-Service AudioEndpointBuilder -StartupType Automatic; Start-Service AudioEndpointBuilder
          Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv
          Start-Sleep 5
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status
      - name: Smoke test, microphone turned off in Windows' privacy settings
        run: node smoke/smoke.mjs target/release/yogurt-audio.exe denied
      - name: Let desktop apps use the microphone
        run: |
          $k = 'Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
          foreach ($p in "HKLM:\$k", "HKCU:\$k", "HKCU:\$k\NonPackaged") {
            New-Item -Path $p -Force | Out-Null
            Set-ItemProperty -Path $p -Name Value -Value Allow
          }
      - name: Smoke test, the computer's sound from another app
        run: |
          node smoke/smoke.mjs x tone "$env:RUNNER_TEMP/tone.wav"
          $p = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', "(New-Object Media.SoundPlayer '$env:RUNNER_TEMP/tone.wav').PlaySync()"
          Start-Sleep 2
          try { node smoke/smoke.mjs target/release/yogurt-audio.exe live } finally { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue }
      - name: Smoke test, the whole-output fallback (Windows before 10 2004)
        env:
          YOGURT_AUDIO_LOOPBACK: endpoint
        run: |
          $p = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', "(New-Object Media.SoundPlayer '$env:RUNNER_TEMP/tone.wav').PlaySync()"
          Start-Sleep 2
          try { node smoke/smoke.mjs target/release/yogurt-audio.exe live } finally { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue }
      - name: Smoke test, Yogurt's own sound left out
        run: node smoke/smoke.mjs target/release/yogurt-audio.exe excluded
      - name: Smoke test, devices present
        run: node smoke/smoke.mjs target/release/yogurt-audio.exe basic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: yogurt-audio-windows
          path: |
            app/native/yogurt-audio-win/target/release/yogurt-audio.exe
            app/native/yogurt-audio-win/Cargo.lock
          if-no-files-found: ignore
          retention-days: 14
