<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Finder's title bar covers the bottom ~30pt of the window, so nothing sits below y≈350 -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.75">
      <stop offset="0" stop-color="#F1EAFE"/>
      <stop offset="0.55" stop-color="#F8F5FE"/>
      <stop offset="1" stop-color="#FCFBFE"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" x2="1">
      <stop offset="0" stop-color="#B49AF5"/>
      <stop offset="1" stop-color="#7142E8"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2.5 2 L8.5 6 L2.5 10" fill="none" stroke="#7142E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#2B1B4D" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4B2A9E" flood-opacity="0.08"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#7142E8" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="660" height="400" fill="url(#glow)"/>
  <rect width="660" height="400" fill="url(#dots)"/>

  <text x="330" y="62" text-anchor="middle" font-family="Bricolage, sans-serif" font-size="27" font-weight="600" letter-spacing="-0.6" fill="#23242A">Drag Yogurt into Applications</text>
  <text x="330" y="89" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" fill="#6E6F7B">Then open it from your Applications folder.</text>

  <!-- soft cards behind the two icons and their names -->
  <rect x="102" y="128" width="156" height="166" rx="26" fill="#FFFFFF" stroke="#E9E4F3" filter="url(#lift)"/>
  <rect x="402" y="128" width="156" height="166" rx="26" fill="#FFFFFF" stroke="#E9E4F3" filter="url(#lift)"/>

  <path d="M276 207 C 306 186, 352 186, 380 205" fill="none" stroke="url(#arrow)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#head)"/>

  <text x="330" y="340" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#A3A0B3">Meeting notes that stay on your Mac</text>
</svg>
