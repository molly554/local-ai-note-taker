# the id, the name and the program's file name are also in src/shared/brand.ts (test/builderConfig.test.ts keeps them the same)
appId: ai.lynote.notetaker
productName: Lynote NoteTaker
# a fork of Yogurt (MIT): Frigade's copyright stays, with the people who changed it since
copyright: Copyright © 2026 Frigade and the Lynote NoteTaker contributors
# GitHub Releases: every v* tag builds Mac, Windows and Linux (.github/workflows/release.yml).
# Fixed file names, so releases/latest/download/Lynote-NoteTaker-mac-arm64.dmg (and the Windows and Linux ones) point at the newest.
# Installed copies update from the same release (latest-mac.yml, latest.yml, latest-linux.yml; src/main/updates.ts).
publish:
  provider: github
  owner: molly554
  repo: local-ai-note-taker
  releaseType: release
# the package's name: the Windows install folder (%LOCALAPPDATA%\Programs\lynote-notetaker) and the updater's cache
extraMetadata:
  name: lynote-notetaker
directories:
  # dist/ only: with another output folder electron-builder packs the whole project
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # the helpers (scripts/native.mjs): on a Mac native.sh's calendar, call detection and names in calls, recording,
  # speech to text; on Windows and Linux the Rust recorder, system helper and AI apps relay, and whisper-server
  - from: resources/bin
    to: bin
  # Silero VAD for whisper-server (native.sh or whisper-build.mjs fetch it, checked against its sha256)
  - from: resources/vad
    to: vad
  # the Mac's menu bar icon (tray.ts reads it from Resources; @2x is picked up next to it)
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray@2x.png
    to: tray@2x.png
  # licenses of things bundled or downloaded: fonts, whisper.cpp, Silero VAD, libopus, the native recorders' crates,
  # whisper-server's headers, animate-ui and the CUDA runtime
  - from: resources/licenses
    to: licenses
  # the Mac's About window shows Resources/Credits.html under the version, with its link
  - from: resources/about/Credits.html
    to: Credits.html
# Electron's switches a shipped app doesn't need, off so nobody can run it as plain Node or attach a debugger to it;
# the app loads only from its own app.asar, checked against the hash in Info.plist.
# Local debugging can enable the inspector with YOGURT_FUSES=0 in scripts/release-mac.sh.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
# Linux: `lynote-notetaker` becomes a launcher that starts Electron on X11 on a Wayland desktop (build/linux-launcher.sh)
afterPack: scripts/linux-launcher.cjs
asarUnpack:
  # the notes model's engine loads native binaries; they can't run from inside the asar archive
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"
mac:
  # a platform's files list replaces the one above, so it repeats it
  files:
    - out/**
    - package.json
    # this Mac build only needs the Apple Silicon engine binaries
    - "!**/node_modules/@node-llama-cpp/{linux,win,mac-x64}*/**"
    - "!**/node_modules/node-llama-cpp/bins/{linux,win,mac-x64}*/**"
  artifactName: Lynote-NoteTaker-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
    # what an installed copy downloads to update itself (src/main/updates.ts)
    - target: zip
      arch: [arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  # Core Audio process taps (the call's sound) and their permission prompt arrived in 14.4
  minimumSystemVersion: "14.4"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  # Electron's own helpers; each program in Resources/bin gets its own set (scripts/sign.cjs)
  entitlementsInherit: build/entitlements.mac.inherit.plist
  sign: scripts/sign.cjs
  extendInfo:
    # a Dock app, with its menu bar icon too
    LSUIElement: false
    NSMicrophoneUsageDescription: Lynote NoteTaker records your voice in meetings so it can write the transcript and your notes. The recording stays on your Mac.
    NSAudioCaptureUsageDescription: Lynote NoteTaker records the sound of your calls so it can write down what others say. The recording stays on your Mac.
    NSCalendarsFullAccessUsageDescription: Lynote NoteTaker reads your calendar to name your notes after the meeting and to know who is in it. It stays on your Mac unless you turn on Cloud AI.
    NSCalendarsUsageDescription: Lynote NoteTaker reads your calendar to name your notes after the meeting and to know who is in it. It stays on your Mac unless you turn on Cloud AI.
    NSAppleEventsUsageDescription: Lynote NoteTaker checks the browser tab's name to tell when you're in a call, and pauses your music while it records.
    # the recording never leaves the Mac; with Cloud AI on (Settings, off by default) the transcript's text does, so these don't say "nothing"
    # Electron's own defaults ("This app needs access to..."): the app never asks for these, so plain words instead
    NSCameraUsageDescription: Lynote NoteTaker doesn't use the camera.
    NSBluetoothAlwaysUsageDescription: Lynote NoteTaker doesn't use Bluetooth.
    NSBluetoothPeripheralUsageDescription: Lynote NoteTaker doesn't use Bluetooth.
  # signs with the Developer ID certificate in the keychain (or CSC_LINK on CI); notarized by scripts/release-mac.sh or CI
# Windows and Linux: unsigned, built by .github/workflows/preview.yml (by hand, or for a release from release.yml).
win:
  # a platform's files list replaces the one above, so it repeats it
  files:
    - out/**
    - package.json
    # this Windows build only needs the x64 Windows engine binaries
    - "!**/node_modules/@node-llama-cpp/{linux,mac,win-arm64}*/**"
    - "!**/node_modules/node-llama-cpp/bins/{linux,mac,win-arm64}*/**"
  # added to the extra resources above (unlike files, these merge): the word list for lowercase respelling (scripts/native.mjs; a Mac has its own)
  extraResources:
    - { from: resources/dict, to: dict }
    # the speed check's clip (src/main/asr/speedCheck.ts): a Mac never times its speech model
    - { from: resources/speed, to: speed }
    # the tray's colour icons (tray.ts; @2x next to them), a Mac uses its template tray.png
    - { from: resources, to: ., filter: ["tray-color*.png", "tray-recording*.png"] }
  artifactName: Lynote-NoteTaker-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  # never true: uninstalling would delete every meeting, transcript and recording with the models
  deleteAppDataOnUninstall: false
linux:
  files:
    - out/**
    - package.json
    # this Linux build only needs the x64 Linux engine binaries
    - "!**/node_modules/@node-llama-cpp/{mac,win,linux-arm,linux-riscv}*/**"
    - "!**/node_modules/node-llama-cpp/bins/{mac,win,linux-arm,linux-riscv}*/**"
  # the default comes from the package name, which isn't a good file name
  executableName: lynote-notetaker
  # added to the extra resources above (unlike files, these merge): the word list for lowercase respelling (scripts/native.mjs; a Mac has its own)
  extraResources:
    - { from: resources/dict, to: dict }
    # the speed check's clip (src/main/asr/speedCheck.ts): a Mac never times its speech model
    - { from: resources/speed, to: speed }
    # the tray's colour icons (tray.ts; @2x next to them), a Mac uses its template tray.png
    - { from: resources, to: ., filter: ["tray-color*.png", "tray-recording*.png"] }
  artifactName: Lynote-NoteTaker-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Office
dmg:
  title: Lynote NoteTaker
  # build/background.png (+ @2x), from build/dmg-background.svg
  background: build/background.png
  iconSize: 96
  window: { width: 660, height: 400 }
  contents:
    - { x: 180, y: 205 }
    - { x: 480, y: 205, type: link, path: /Applications }
  # the disk image is checked when downloaded, not just the app inside
  sign: true
