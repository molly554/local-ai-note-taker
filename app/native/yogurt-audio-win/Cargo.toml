# yogurt-audio for Windows: the same recorder protocol as native/yogurt-audio (Swift), written with WASAPI.
# Every version is exact and at least two weeks old; Cargo.lock carries the checksums.
[package]
name = "yogurt-audio"
version = "0.1.0"
edition = "2021"
# the oldest compiler the lockfile resolves for, so transitive picks stay on older releases
rust-version = "1.82"
resolver = "3"
publish = false
license = "MIT"

[[bin]]
name = "yogurt-audio"
path = "src/main.rs"

[dependencies]
# libopus 1.3.1, built from its bundled source as a static library
audiopus_sys = "=0.2.2"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
# a panic ends the helper, so Yogurt restarts it as the next part instead of recording silence
panic = "abort"
lto = true
codegen-units = 1
