# Yogurt's recorder on Linux: the same command line, stdin and stdout as app/native/yogurt-audio (Swift, Mac),
# recording through PulseAudio (PipeWire answers it too, through pipewire-pulse) into Ogg Opus files.
[package]
name = "yogurt-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[[bin]]
name = "yogurt-audio"
path = "src/main.rs"

[dependencies]
# libpulse is linked dynamically: every desktop with PulseAudio or PipeWire has libpulse.so.0
libpulse-binding = { version = "=2.30.1", default-features = false, features = ["pa_v8"] }
libpulse-simple-binding = { version = "=2.29.0", default-features = false, features = ["pa_v8"] }
opus = "=0.3.1"
# libopus is built from the bundled source and linked in (see .cargo/config.toml), so the AppImage needs no libopus
audiopus_sys = "=0.2.2"
ogg = "=0.9.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
