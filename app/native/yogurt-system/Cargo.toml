# yogurt-system: what yogurt-mac answers for call detection, on Windows and Linux.
# Same subcommands and JSON as app/native/yogurt-mac, so detectSignals.ts reads either.
[package]
name = "yogurt-system"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
# pick dependency versions this compiler can build
resolver = "3"
license = "MIT"
publish = false

[dependencies]
serde_json = "=1.0.140"

[target.'cfg(windows)'.dependencies]
winreg = "=0.52.0"
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "=2.30.1"
x11rb = "=0.13.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
